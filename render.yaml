# Configuración de los servicios en Render, versionada en el repositorio.
# Render la lee al crear el servicio con "New > Blueprint".
#
# Estos son los servicios del entorno de desarrollo de UTMA, que despliegan
# desde utma-tech/sistemalegal. Llevan "utma" en el nombre para no chocar con
# sistemalegal-api, el servicio que despliega desde martinmaine/sistemalegal
# (ver docs/flujo-repositorios.md). Al transferir a Martín, se vuelven a los
# nombres sin "utma".
#
# Las variables marcadas con sync: false NO viajan en el repositorio: se cargan
# a mano en el panel de Render (docs/arquitectura.md, sección 6).
services:
  - type: web
    name: sistemalegal-utma-api
    runtime: node
    plan: free
    region: oregon
    # Solo main despliega; las ramas de trabajo se prueban en local y en CI.
    branch: main
    autoDeploy: true
    rootDir: backend
    # --include=dev no es opcional: NODE_ENV=production hace que npm ci omita
    # las devDependencies, y entonces el build no usa el TypeScript del
    # lockfile sino el tsc global de la imagen de Render, que es otra version.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      # Cadena de conexión de Supabase. Tiene que ser la del POOLER compartido en
      # modo transacción (aws-X-REGION.pooler.supabase.com:6543), no la conexión
      # directa: esa es IPv6 y Render no tiene salida IPv6.
      - key: DATABASE_URL
        sync: false
      # Dominio de producción de Vercel.
      - key: CORS_ORIGIN
        sync: false
      # Secreto con el que se firman los tokens de acceso. OBLIGATORIO: con
      # NODE_ENV=production el servicio se niega a arrancar si falta o tiene menos
      # de 32 caracteres, a propósito, para no firmar sesiones con un secreto
      # efímero que cambia en cada reinicio. Generarlo con:
      #   node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"
      - key: JWT_SECRET
        sync: false
      - key: CORS_PREFIJO_PREVIEW
        value: sistemalegal
      # Slug del equipo de Vercel: el final del subdominio de los previews
      # (sistemalegal-abc123-<slug>.vercel.app). Sin el, cualquier cuenta de
      # Vercel con un proyecto sistemalegal-* pasa el CORS. Si se define, el
      # dominio de produccion (sistemalegal-henna.vercel.app) tiene que estar
      # en CORS_ORIGIN, porque no termina en el slug.
      - key: CORS_SUFIJO_EQUIPO
        sync: false
      # El navegador le habla a Vercel, que reenvía /api a este servicio
      # (frontend/vercel.json): hay dos proxies delante de Express y la cookie
      # de sesión es de primera parte.
      - key: SALTOS_PROXY
        value: '2'
      - key: COOKIE_SAMESITE
        value: lax
      # Microservicio de PDF (servicio de abajo). URL pública de Render, sin barra final.
      - key: PDF_SERVICE_URL
        sync: false
      - key: PDF_SERVICE_TOKEN
        sync: false
      # Supabase Storage para los documentos: el disco de Render gratis se borra
      # en cada despliegue. Clave service_role (Settings > API): solo vive acá.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: documentos
      # Agenda y notificaciones (fase 5, docs/fase-5-agenda-notificaciones.md).
      # El correo queda DESHABILITADO hasta configurar y validar proveedor,
      # dominio y programador: no se envía nada real por defecto.
      - key: ZONA_HORARIA
        value: America/Argentina/Buenos_Aires
      - key: CORREO_MODO
        value: deshabilitado
      - key: CORREO_PROVEEDOR
        value: resend
      - key: CORREO_REMITENTE
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      # Secreto del programador externo (Supabase Cron llama a
      # /api/interno/programador). 48+ caracteres, distinto de JWT_SECRET.
      - key: CRON_SECRET
        sync: false

  - type: web
    name: sistemalegal-utma-pdf
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    rootDir: pdf-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: '3.12.8'
      # El mismo valor que PDF_SERVICE_TOKEN del backend.
      - key: PDF_SERVICE_TOKEN
        sync: false
